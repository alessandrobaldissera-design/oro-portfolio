<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafoglio Oro - Gestione investimenti in tempo reale">
  <meta name="theme-color" content="#d4af37">
  <title>Portafoglio Oro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      padding: 1rem;
      border-bottom: 2px solid #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      color: #d4af37;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .currency-selector {
      display: flex;
      gap: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #d4af37;
    }

    .currency-btn {
      background: transparent;
      border: none;
      color: #e0e0e0;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .currency-btn.active {
      background: #d4af37;
      color: #0a0e27;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .period-selector {
      display: flex;
      gap: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #d4af37;
      flex-wrap: wrap;
    }

    .period-btn {
      background: transparent;
      border: 1px solid #d4af37;
      color: #e0e0e0;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.85rem;
    }

    .period-btn.active {
      background: #d4af37;
      color: #0a0e27;
    }

    .chart-container {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 1.5rem;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .card h3 {
      font-size: 0.9rem;
      color: #c9a961;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card .value {
      font-size: 1.8rem;
      color: #d4af37;
      font-weight: 700;
    }

    .gain { color: #4ade80; }
    .loss { color: #f87171; }

    .tabs {
      display: flex;
      gap: 1rem;
      border-bottom: 2px solid #1a1f3a;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #888;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      font-weight: 600;
    }

    .tab-btn.active {
      color: #d4af37;
      border-bottom-color: #d4af37;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #c9a961;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      background: #1a1f3a;
      border: 1px solid #d4af37;
      color: #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #c9a961;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    button.btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
      width: 100%;
    }

    button.btn:hover {
      background: #c9a961;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    th {
      background: rgba(212, 175, 55, 0.1);
      color: #d4af37;
      padding: 1rem;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a1f3a;
    }

    .export-btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
    }

    .sync-container {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .sync-btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      min-width: 150px;
    }

    .sync-btn:hover {
      background: #c9a961;
    }

    .sync-status {
      color: #4ade80;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .sync-error {
      color: #f87171;
    }

    .google-signin {
      width: 100%;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Portafoglio Oro</h1>
      <div class="header-controls">
        <div class="currency-selector">
          <button class="currency-btn active" data-currency="CHF">CHF</button>
          <button class="currency-btn" data-currency="EUR">EUR</button>
          <button class="currency-btn" data-currency="USD">USD</button>
        </div>
        <div id="googleLoginContainer" style="display: none;">
          <button id="googleSignIn" class="sync-btn" style="min-width: 100px; margin: 0;">Google Drive</button>
        </div>
        <div id="googleLoggedIn" style="display: none; gap: 0.5rem;">
          <span id="userEmail" style="color: #d4af37; font-size: 0.9rem;"></span>
          <button id="googleSignOut" class="sync-btn" style="min-width: 100px; margin: 0; padding: 0.5rem 1rem;">Esci</button>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="summary">
        <div class="card">
          <h3>Valore Totale</h3>
          <div class="value" id="totalValue">0.00</div>
          <div class="currency" id="totalCurrency">CHF</div>
        </div>
        <div class="card">
          <h3>Guadagno / Perdita</h3>
          <div class="value" id="gainLoss" style="color: #d4af37;">0.00</div>
          <div class="currency" id="gainLossPct">0%</div>
        </div>
        <div class="card">
          <h3>Posizioni Attive</h3>
          <div class="value" id="positionCount">0</div>
        </div>
      </div>

      <div>
        <h3 style="color: #d4af37; margin-bottom: 0.75rem;">Periodo Grafico</h3>
        <div class="period-selector" id="periodSelector">
          <button class="period-btn active" data-period="7">7 giorni</button>
          <button class="period-btn" data-period="30">30 giorni</button>
          <button class="period-btn" data-period="90">90 giorni</button>
          <button class="period-btn" data-period="365">1 anno</button>
          <button class="period-btn" data-period="all">Tutto</button>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="goldChart"></canvas>
      </div>

      <div class="chart-container">
        <canvas id="silverChart"></canvas>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="overview">Panoramica</button>
        <button class="tab-btn" data-tab="new">Nuovo Acquisto</button>
        <button class="tab-btn" data-tab="history">Storico</button>
      </div>

      <div class="tab-content active" id="overview">
        <div id="positionsContainer">
          <table id="positionsTable">
            <thead>
              <tr>
                <th>Metallo</th>
                <th>Quantità</th>
                <th>Prezzo Attuale</th>
                <th>Valore Attuale</th>
                <th>Costo Medio</th>
                <th>Gain/Loss</th>
              </tr>
            </thead>
            <tbody id="positionsTableBody"></tbody>
          </table>
        </div>
        <button class="export-btn" onclick="exportCSV()">Esporta CSV</button>
        <div class="sync-container" id="syncControls" style="display: none;">
          <button class="sync-btn" onclick="syncToGoogleDrive()">💾 Sincronizza su Drive</button>
          <button class="sync-btn" onclick="loadFromGoogleDrive()">📥 Carica da Drive</button>
          <span id="syncStatus" class="sync-status"></span>
        </div>
      </div>

      <div class="tab-content" id="new">
        <form onsubmit="addPosition(event)">
          <div class="form-group">
            <label>Metallo</label>
            <select id="metal" required>
              <option value="gold">Oro (g)</option>
              <option value="silver">Argento (g)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantità (grammi)</label>
            <input type="number" id="quantity" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Prezzo Unitario</label>
            <div style="display: flex; gap: 0.5rem;">
              <input type="number" id="price" step="0.01" required style="flex: 1;">
              <input type="text" id="priceCurrency" placeholder="CHF" style="width: 80px;" value="CHF">
            </div>
          </div>
          <div class="form-group">
            <label>Data Acquisto</label>
            <input type="date" id="date" required>
          </div>
          <button class="btn" type="submit">Aggiungi Posizione</button>
        </form>
      </div>

      <div class="tab-content" id="history">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Metallo</th>
              <th>Quantità</th>
              <th>Prezzo</th>
              <th>Valuta</th>
              <th>Totale (CHF)</th>
              <th>Azione</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Google OAuth Configuration
    const GOOGLE_CLIENT_ID = '747638907098-bpk0m9j5jc5v7kqk8lmnop9q8r9s0t1u.apps.googleusercontent.com';
    let googleAccessToken = null;

    // App State
    const state = {
      positions: [],
      currentCurrency: 'CHF',
      currentPrices: { gold: 68.5, silver: 0.91 },
      exchangeRates: { CHF: 1, EUR: 0.92, USD: 1.08 },
      priceHistory: [], // Array di {date, gold, silver}
      selectedPeriod: 7
    };

    // Fetch real prices e aggiorna storico
    async function fetchPrices() {
      try {
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=gold,silver&vs_currencies=chf');
        const data = await response.json();
        const today = new Date().toISOString().split('T')[0];
        let updated = false;

        if (data && data.gold && data.gold.chf) {
          const goldPrice = data.gold.chf / 31.1035;
          state.currentPrices.gold = goldPrice;
          updated = true;
        }
        if (data && data.silver && data.silver.chf) {
          const silverPrice = data.silver.chf / 31.1035;
          state.currentPrices.silver = silverPrice;
          updated = true;
        }

        if (updated) {
          // Aggiungi al storico se non già presente
          if (!state.priceHistory.find(h => h.date === today)) {
            state.priceHistory.push({ date: today, gold: state.currentPrices.gold, silver: state.currentPrices.silver });
            savePriceHistory();
          }
        }
      } catch (e) {
        console.log('API fallback:', e);
      }
      updateUI();
    }

    // Load storico prezzi da localStorage
    function loadPriceHistory() {
      const saved = localStorage.getItem('priceHistory');
      if (saved) {
        state.priceHistory = JSON.parse(saved);
      }
    }

    // Salva storico prezzi
    function savePriceHistory() {
      localStorage.setItem('priceHistory', JSON.stringify(state.priceHistory));
    }

    // Load data from localStorage
    function loadData() {
      const saved = localStorage.getItem('goldPortfolio');
      if (saved) {
        state.positions = JSON.parse(saved);
      }
    }

    // Save data to localStorage
    function saveData() {
      localStorage.setItem('goldPortfolio', JSON.stringify(state.positions));
    }

    // Add position
    function addPosition(e) {
      e.preventDefault();
      const metal = document.getElementById('metal').value;
      const quantity = parseFloat(document.getElementById('quantity').value);
      const price = parseFloat(document.getElementById('price').value);
      const priceCurrency = document.getElementById('priceCurrency').value || 'CHF';
      const date = document.getElementById('date').value;

      state.positions.push({ metal, quantity, price, priceCurrency, date });
      saveData();
      document.getElementById('new').querySelector('form').reset();
      document.getElementById('priceCurrency').value = 'CHF';
      updateUI();
    }

    // Update UI
    function updateUI() {
      updatePositionsTable();
      updateHistoryTable();
      updateSummary();
      updateChart();
    }

    function updatePositionsTable() {
      const tbody = document.getElementById('positionsTableBody');
      tbody.innerHTML = '';

      const goldPositions = state.positions.filter(p => p.metal === 'gold');
      const silverPositions = state.positions.filter(p => p.metal === 'silver');

      const goldQuantity = goldPositions.reduce((sum, p) => sum + p.quantity, 0);
      const silverQuantity = silverPositions.reduce((sum, p) => sum + p.quantity, 0);

      const goldCostBasis = goldPositions.reduce((sum, p) => sum + (p.quantity * p.price * (state.exchangeRates[p.priceCurrency] || 1)), 0);
      const silverCostBasis = silverPositions.reduce((sum, p) => sum + (p.quantity * p.price * (state.exchangeRates[p.priceCurrency] || 1)), 0);

      const goldCurrent = state.currentPrices.gold * state.exchangeRates[state.currentCurrency];
      const silverCurrent = state.currentPrices.silver * state.exchangeRates[state.currentCurrency];

      const goldValue = goldQuantity * goldCurrent;
      const silverValue = silverQuantity * silverCurrent;

      if (goldQuantity > 0) {
        const costAvg = goldCostBasis / goldQuantity;
        const gain = goldValue - goldCostBasis;
        const gainPct = ((gain / goldCostBasis) * 100).toFixed(2);
        tbody.innerHTML += `<tr>
          <td>Oro</td>
          <td>${goldQuantity.toFixed(2)}g</td>
          <td>${goldCurrent.toFixed(2)} ${state.currentCurrency}/g</td>
          <td>${goldValue.toFixed(2)} ${state.currentCurrency}</td>
          <td>${costAvg.toFixed(2)} CHF/g</td>
          <td class="${gain >= 0 ? 'gain' : 'loss'}">${gain.toFixed(2)} (${gainPct}%)</td>
        </tr>`;
      }

      if (silverQuantity > 0) {
        const costAvg = silverCostBasis / silverQuantity;
        const gain = silverValue - silverCostBasis;
        const gainPct = ((gain / silverCostBasis) * 100).toFixed(2);
        tbody.innerHTML += `<tr>
          <td>Argento</td>
          <td>${silverQuantity.toFixed(2)}g</td>
          <td>${silverCurrent.toFixed(2)} ${state.currentCurrency}/g</td>
          <td>${silverValue.toFixed(2)} ${state.currentCurrency}</td>
          <td>${costAvg.toFixed(2)} CHF/g</td>
          <td class="${gain >= 0 ? 'gain' : 'loss'}">${gain.toFixed(2)} (${gainPct}%)</td>
        </tr>`;
      }

      if (goldQuantity === 0 && silverQuantity === 0) {
        document.getElementById('positionsContainer').innerHTML = '<div class="empty-state">Nessuna posizione. Aggiungi un nuovo acquisto dal tab "Nuovo Acquisto".</div>';
      }
    }

    function updateHistoryTable() {
      const tbody = document.getElementById('historyTable');
      tbody.innerHTML = '';
      state.positions.forEach((pos, i) => {
        const currency = pos.priceCurrency || 'CHF';
        const costInChf = pos.quantity * pos.price * (state.exchangeRates[currency] || 1);
        tbody.innerHTML += `<tr>
          <td>${pos.date}</td>
          <td>${pos.metal === 'gold' ? 'Oro' : 'Argento'}</td>
          <td>${pos.quantity.toFixed(2)}g</td>
          <td>${pos.price.toFixed(2)}</td>
          <td>${currency}</td>
          <td>${costInChf.toFixed(2)}</td>
          <td><button onclick="deletePosition(${i})" style="background:#f87171;color:white;border:none;padding:0.5rem;border-radius:4px;cursor:pointer;font-weight:600;">Elimina</button></td>
        </tr>`;
      });
    }

    function updateSummary() {
      // Calcola costo totale in CHF
      const totalCostInChf = state.positions.reduce((sum, p) => {
        return sum + (p.quantity * p.price * (state.exchangeRates[p.priceCurrency] || 1));
      }, 0);

      // Calcola valore attuale
      const goldQuantity = state.positions.filter(p => p.metal === 'gold').reduce((sum, p) => sum + p.quantity, 0);
      const silverQuantity = state.positions.filter(p => p.metal === 'silver').reduce((sum, p) => sum + p.quantity, 0);

      const goldValueInChf = goldQuantity * state.currentPrices.gold;
      const silverValueInChf = silverQuantity * state.currentPrices.silver;
      const totalValueInChf = goldValueInChf + silverValueInChf;

      // Converti nella valuta selezionata
      const totalValue = totalValueInChf * state.exchangeRates[state.currentCurrency];
      const totalCost = totalCostInChf * state.exchangeRates[state.currentCurrency];

      // Calcola gain/loss
      const gainLoss = totalValue - totalCost;
      const gainLossPct = totalCost > 0 ? ((gainLoss / totalCost) * 100).toFixed(2) : 0;

      document.getElementById('totalValue').textContent = totalValue.toFixed(2);
      document.getElementById('totalCurrency').textContent = state.currentCurrency;
      document.getElementById('gainLoss').textContent = gainLoss.toFixed(2);
      document.getElementById('gainLoss').className = 'value ' + (gainLoss >= 0 ? 'gain' : 'loss');
      document.getElementById('gainLossPct').textContent = gainLossPct + '%';
      document.getElementById('positionCount').textContent = state.positions.length;
    }

    let goldChartInstance = null;
    let silverChartInstance = null;

    function getChartData() {
      const period = state.selectedPeriod;
      const now = new Date();
      const cutoffDate = new Date(now.getTime() - period * 24 * 60 * 60 * 1000);

      let filteredHistory = state.priceHistory;
      if (period !== 'all') {
        filteredHistory = state.priceHistory.filter(h => new Date(h.date) >= cutoffDate);
      }

      // Se non ci sono dati, crea dati di fallback
      if (filteredHistory.length === 0) {
        filteredHistory = [
          { date: new Date().toISOString().split('T')[0], gold: state.currentPrices.gold, silver: state.currentPrices.silver }
        ];
      }

      const labels = filteredHistory.map(h => {
        const d = new Date(h.date);
        return d.toLocaleDateString('it-IT', { month: 'short', day: 'numeric' });
      });

      return { labels, data: filteredHistory };
    }

    function updateChart() {
      const chartData = getChartData();

      // Oro Chart
      const goldCtx = document.getElementById('goldChart')?.getContext('2d');
      if (goldCtx) {
        if (goldChartInstance) goldChartInstance.destroy();
        goldChartInstance = new Chart(goldCtx, {
          type: 'line',
          data: {
            labels: chartData.labels,
            datasets: [{
              label: `Oro (CHF/g)`,
              data: chartData.data.map(h => h.gold),
              borderColor: '#d4af37',
              backgroundColor: 'rgba(212, 175, 55, 0.1)',
              tension: 0.3,
              fill: true,
              pointRadius: 3,
              pointBackgroundColor: '#d4af37'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#e0e0e0' } } },
            scales: {
              y: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } },
              x: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } }
            }
          }
        });
      }

      // Argento Chart
      const silverCtx = document.getElementById('silverChart')?.getContext('2d');
      if (silverCtx) {
        if (silverChartInstance) silverChartInstance.destroy();
        silverChartInstance = new Chart(silverCtx, {
          type: 'line',
          data: {
            labels: chartData.labels,
            datasets: [{
              label: `Argento (CHF/g)`,
              data: chartData.data.map(h => h.silver),
              borderColor: '#c0c0c0',
              backgroundColor: 'rgba(192, 192, 192, 0.1)',
              tension: 0.3,
              fill: true,
              pointRadius: 3,
              pointBackgroundColor: '#c0c0c0'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#e0e0e0' } } },
            scales: {
              y: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } },
              x: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } }
            }
          }
        });
      }
    }

    function deletePosition(index) {
      state.positions.splice(index, 1);
      saveData();
      updateUI();
    }

    function exportCSV() {
      let csv = 'Data,Metallo,Quantità,Prezzo,Valuta,Totale CHF\n';
      state.positions.forEach(pos => {
        const costInChf = pos.quantity * pos.price * (state.exchangeRates[pos.priceCurrency] || 1);
        csv += `${pos.date},${pos.metal},${pos.quantity},${pos.price},${pos.priceCurrency},${costInChf}\n`;
      });
      const link = document.createElement('a');
      link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      link.download = 'portafoglio-oro.csv';
      link.click();
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById(e.target.dataset.tab).classList.add('active');
      });
    });

    // Currency switching
    document.querySelectorAll('.currency-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.currentCurrency = e.target.dataset.currency;
        updateUI();
      });
    });

    // Period switching
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.selectedPeriod = e.target.dataset.period === 'all' ? 'all' : parseInt(e.target.dataset.period);
        updateChart();
      });
    });

    // Google Drive Sync Functions
    function initializeGoogleAuth() {
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        ux_mode: 'popup'
      });

      document.getElementById('googleSignIn')?.addEventListener('click', () => {
        window.google.accounts.id.renderButton(
          document.getElementById('googleSignIn'),
          { theme: 'filled_blue', size: 'large' }
        );
        window.google.accounts.id.prompt();
      });

      document.getElementById('googleSignOut')?.addEventListener('click', () => {
        window.google.accounts.id.disableAutoSelect();
        googleAccessToken = null;
        document.getElementById('googleLoggedIn').style.display = 'none';
        document.getElementById('googleLoginContainer').style.display = 'block';
        document.getElementById('syncControls').style.display = 'none';
        localStorage.removeItem('googleAccessToken');
      });

      // Carica token salvato
      const savedToken = localStorage.getItem('googleAccessToken');
      if (savedToken) {
        googleAccessToken = savedToken;
        document.getElementById('googleLoginContainer').style.display = 'none';
        document.getElementById('googleLoggedIn').style.display = 'flex';
        document.getElementById('syncControls').style.display = 'flex';
        document.getElementById('userEmail').textContent = localStorage.getItem('userEmail') || 'Google Drive';
      } else {
        document.getElementById('googleLoginContainer').style.display = 'block';
        document.getElementById('googleLoggedIn').style.display = 'none';
        document.getElementById('syncControls').style.display = 'none';
      }
    }

    function handleCredentialResponse(response) {
      googleAccessToken = response.credential;
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      localStorage.setItem('googleAccessToken', response.credential);
      localStorage.setItem('userEmail', payload.email);
      document.getElementById('userEmail').textContent = payload.email;
      document.getElementById('googleLoginContainer').style.display = 'none';
      document.getElementById('googleLoggedIn').style.display = 'flex';
      document.getElementById('syncControls').style.display = 'flex';
    }

    async function syncToGoogleDrive() {
      if (!googleAccessToken) {
        alert('Per favore, accedi a Google Drive');
        return;
      }

      const statusEl = document.getElementById('syncStatus');
      statusEl.textContent = '⏳ Sincronizzazione...';
      statusEl.className = 'sync-status';

      try {
        // Crea o aggiorna il file su Drive
        const fileData = JSON.stringify({ positions: state.positions, priceHistory: state.priceHistory }, null, 2);
        const metadata = {
          name: 'portafoglio-oro.json',
          mimeType: 'application/json'
        };

        // Cerca se il file esiste già
        const searchResponse = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=name='portafoglio-oro.json'&fields=files(id)`,
          { headers: { 'Authorization': `Bearer ${googleAccessToken}` } }
        );
        const searchData = await searchResponse.json();
        let fileId = searchData.files?.[0]?.id;

        if (fileId) {
          // Aggiorna file esistente
          const updateResponse = await fetch(
            `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
            {
              method: 'PATCH',
              headers: { 'Authorization': `Bearer ${googleAccessToken}` },
              body: fileData
            }
          );
          if (!updateResponse.ok) throw new Error('Aggiornamento fallito');
        } else {
          // Crea nuovo file
          const createResponse = await fetch(
            `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`,
            {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${googleAccessToken}` },
              body: `--boundary\nContent-Type: application/json\n\n${JSON.stringify(metadata)}\n--boundary\nContent-Type: application/json\n\n${fileData}\n--boundary--`
            }
          );
          if (!createResponse.ok) throw new Error('Creazione fallita');
        }

        statusEl.textContent = '✅ Sincronizzato con Google Drive!';
        setTimeout(() => { statusEl.textContent = ''; }, 3000);
      } catch (error) {
        statusEl.textContent = '❌ Errore: ' + error.message;
        statusEl.className = 'sync-status sync-error';
        console.error('Sync error:', error);
      }
    }

    async function loadFromGoogleDrive() {
      if (!googleAccessToken) {
        alert('Per favore, accedi a Google Drive');
        return;
      }

      const statusEl = document.getElementById('syncStatus');
      statusEl.textContent = '⏳ Caricamento...';
      statusEl.className = 'sync-status';

      try {
        // Cerca il file
        const searchResponse = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=name='portafoglio-oro.json'&fields=files(id)`,
          { headers: { 'Authorization': `Bearer ${googleAccessToken}` } }
        );
        const searchData = await searchResponse.json();
        const fileId = searchData.files?.[0]?.id;

        if (!fileId) {
          throw new Error('File non trovato su Google Drive');
        }

        // Scarica il file
        const downloadResponse = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
          { headers: { 'Authorization': `Bearer ${googleAccessToken}` } }
        );
        const data = await downloadResponse.json();
        state.positions = data.positions || [];
        state.priceHistory = data.priceHistory || [];
        saveData();
        savePriceHistory();
        updateUI();

        statusEl.textContent = '✅ Dati caricati da Google Drive!';
        setTimeout(() => { statusEl.textContent = ''; }, 3000);
      } catch (error) {
        statusEl.textContent = '❌ Errore: ' + error.message;
        statusEl.className = 'sync-status sync-error';
        console.error('Load error:', error);
      }
    }

    // Initialize Google Auth quando il documento è caricato
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.google) {
          initializeGoogleAuth();
        }
      }, 500);
    });

    // Initialize
    loadData();
    loadPriceHistory();
    fetchPrices();
    setInterval(fetchPrices, 60 * 1000); // Aggiorna ogni 60 secondi
    updateUI();
  </script>
</body>
