<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafoglio Oro - Gestione investimenti in tempo reale">
  <meta name="theme-color" content="#d4af37">
  <title>Portafoglio Oro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      padding: 1rem;
      border-bottom: 2px solid #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      color: #d4af37;
      font-weight: 700;
    }

    .currency-selector {
      display: flex;
      gap: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #d4af37;
    }

    .currency-btn {
      background: transparent;
      border: none;
      color: #e0e0e0;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .currency-btn.active {
      background: #d4af37;
      color: #0a0e27;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .chart-container {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 1.5rem;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }

    .card {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .card h3 {
      font-size: 0.9rem;
      color: #c9a961;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card .value {
      font-size: 1.8rem;
      color: #d4af37;
      font-weight: 700;
    }

    .gain { color: #4ade80; }
    .loss { color: #f87171; }

    .tabs {
      display: flex;
      gap: 1rem;
      border-bottom: 2px solid #1a1f3a;
      margin-bottom: 1rem;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #888;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      font-weight: 600;
    }

    .tab-btn.active {
      color: #d4af37;
      border-bottom-color: #d4af37;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #c9a961;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      background: #1a1f3a;
      border: 1px solid #d4af37;
      color: #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #c9a961;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    button.btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
      width: 100%;
    }

    button.btn:hover {
      background: #c9a961;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th {
      background: rgba(212, 175, 55, 0.1);
      color: #d4af37;
      padding: 1rem;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a1f3a;
    }

    .export-btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Portafoglio Oro</h1>
      <div class="currency-selector">
        <button class="currency-btn active" data-currency="CHF">CHF</button>
        <button class="currency-btn" data-currency="EUR">EUR</button>
        <button class="currency-btn" data-currency="USD">USD</button>
      </div>
    </header>

    <div class="content">
      <div class="summary">
        <div class="card">
          <h3>Valore Totale</h3>
          <div class="value" id="totalValue">0.00</div>
          <div class="currency" id="totalCurrency">CHF</div>
        </div>
        <div class="card">
          <h3>Guadagno / Perdita</h3>
          <div class="value" id="gainLoss" style="color: #d4af37;">0.00</div>
          <div class="currency" id="gainLossPct">0%</div>
        </div>
        <div class="card">
          <h3>Posizioni Attive</h3>
          <div class="value" id="positionCount">0</div>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="priceChart"></canvas>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="overview">Panoramica</button>
        <button class="tab-btn" data-tab="new">Nuovo Acquisto</button>
        <button class="tab-btn" data-tab="history">Storico</button>
      </div>

      <div class="tab-content active" id="overview">
        <table>
          <thead>
            <tr>
              <th>Metallo</th>
              <th>Quantità</th>
              <th>Prezzo Attuale</th>
              <th>Valore</th>
            </tr>
          </thead>
          <tbody id="positionsTable"></tbody>
        </table>
        <button class="export-btn" onclick="exportCSV()">Esporta CSV</button>
      </div>

      <div class="tab-content" id="new">
        <form onsubmit="addPosition(event)">
          <div class="form-group">
            <label>Metallo</label>
            <select id="metal" required>
              <option value="gold">Oro (g)</option>
              <option value="silver">Argento (g)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantità</label>
            <input type="number" id="quantity" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Prezzo Unitario (CHF)</label>
            <input type="number" id="price" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Data Acquisto</label>
            <input type="date" id="date" required>
          </div>
          <button class="btn" type="submit">Aggiungi</button>
        </form>
      </div>

      <div class="tab-content" id="history">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Metallo</th>
              <th>Quantità</th>
              <th>Prezzo</th>
              <th>Totale</th>
              <th>Azione</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // App State
    const state = {
      positions: [],
      currentCurrency: 'CHF',
      currentPrices: { gold: 68.5, silver: 0.91 },
      exchangeRates: { CHF: 1, EUR: 0.92, USD: 1.08 }
    };

    // Fetch real prices
    async function fetchPrices() {
      try {
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=gold,silver&vs_currencies=chf');
        const data = await response.json();
        if (data && data.gold && data.gold.chf) {
          state.currentPrices.gold = data.gold.chf / 31.1035;
        }
        if (data && data.silver && data.silver.chf) {
          state.currentPrices.silver = data.silver.chf / 31.1035;
        }
      } catch (e) {
        console.log('API fallback:', e);
      }
      updateUI();
    }

    // Load data from localStorage
    function loadData() {
      const saved = localStorage.getItem('goldPortfolio');
      if (saved) {
        state.positions = JSON.parse(saved);
      }
    }

    // Save data to localStorage
    function saveData() {
      localStorage.setItem('goldPortfolio', JSON.stringify(state.positions));
    }

    // Add position
    function addPosition(e) {
      e.preventDefault();
      const metal = document.getElementById('metal').value;
      const quantity = parseFloat(document.getElementById('quantity').value);
      const price = parseFloat(document.getElementById('price').value);
      const date = document.getElementById('date').value;

      state.positions.push({ metal, quantity, price, date });
      saveData();
      document.getElementById('new').querySelector('form').reset();
      updateUI();
    }

    // Update UI
    function updateUI() {
      updatePositionsTable();
      updateHistoryTable();
      updateSummary();
      updateChart();
    }

    function updatePositionsTable() {
      const tbody = document.getElementById('positionsTable');
      tbody.innerHTML = '';
      const gold = state.positions.filter(p => p.metal === 'gold').reduce((sum, p) => sum + p.quantity, 0);
      const silver = state.positions.filter(p => p.metal === 'silver').reduce((sum, p) => sum + p.quantity, 0);

      if (gold > 0) {
        const goldValue = gold * state.currentPrices.gold * state.exchangeRates[state.currentCurrency];
        tbody.innerHTML += `<tr><td>Oro</td><td>${gold.toFixed(2)}g</td><td>${(state.currentPrices.gold * state.exchangeRates[state.currentCurrency]).toFixed(2)}</td><td>${goldValue.toFixed(2)} ${state.currentCurrency}</td></tr>`;
      }
      if (silver > 0) {
        const silverValue = silver * state.currentPrices.silver * state.exchangeRates[state.currentCurrency];
        tbody.innerHTML += `<tr><td>Argento</td><td>${silver.toFixed(2)}g</td><td>${(state.currentPrices.silver * state.exchangeRates[state.currentCurrency]).toFixed(2)}</td><td>${silverValue.toFixed(2)} ${state.currentCurrency}</td></tr>`;
      }
    }

    function updateHistoryTable() {
      const tbody = document.getElementById('historyTable');
      tbody.innerHTML = '';
      state.positions.forEach((pos, i) => {
        const total = pos.quantity * pos.price * state.exchangeRates[state.currentCurrency];
        tbody.innerHTML += `<tr><td>${pos.date}</td><td>${pos.metal === 'gold' ? 'Oro' : 'Argento'}</td><td>${pos.quantity}</td><td>${(pos.price * state.exchangeRates[state.currentCurrency]).toFixed(2)}</td><td>${total.toFixed(2)}</td><td><button onclick="deletePosition(${i})" style="background:#f87171;color:white;border:none;padding:0.5rem;border-radius:4px;cursor:pointer">Elimina</button></td></tr>`;
      });
    }

    function updateSummary() {
      const gold = state.positions.filter(p => p.metal === 'gold').reduce((sum, p) => sum + p.quantity * p.price, 0);
      const silver = state.positions.filter(p => p.metal === 'silver').reduce((sum, p) => sum + p.quantity * p.price, 0);
      const totalCost = gold + silver;

      const goldValue = state.positions.filter(p => p.metal === 'gold').reduce((sum, p) => sum + p.quantity, 0) * state.currentPrices.gold;
      const silverValue = state.positions.filter(p => p.metal === 'silver').reduce((sum, p) => sum + p.quantity, 0) * state.currentPrices.silver;
      const totalValue = (goldValue + silverValue) * state.exchangeRates[state.currentCurrency];

      const gainLoss = totalValue - (totalCost * state.exchangeRates[state.currentCurrency]);
      const pct = totalCost > 0 ? ((gainLoss / (totalCost * state.exchangeRates[state.currentCurrency])) * 100).toFixed(2) : 0;

      document.getElementById('totalValue').textContent = totalValue.toFixed(2);
      document.getElementById('totalCurrency').textContent = state.currentCurrency;
      document.getElementById('gainLoss').textContent = gainLoss.toFixed(2);
      document.getElementById('gainLoss').className = 'value ' + (gainLoss >= 0 ? 'gain' : 'loss');
      document.getElementById('gainLossPct').textContent = pct + '%';
      document.getElementById('positionCount').textContent = state.positions.length;
    }

    function updateChart() {
      // Simple chart with placeholder data
      const ctx = document.getElementById('priceChart')?.getContext('2d');
      if (ctx) {
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['30gg fa', '20gg fa', '10gg fa', 'Oggi'],
            datasets: [{
              label: 'Oro (CHF/g)',
              data: [65, 66, 67, state.currentPrices.gold],
              borderColor: '#d4af37',
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#e0e0e0' } } },
            scales: { y: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } }, x: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } } }
          }
        });
      }
    }

    function deletePosition(index) {
      state.positions.splice(index, 1);
      saveData();
      updateUI();
    }

    function exportCSV() {
      let csv = 'Data,Metallo,Quantità,Prezzo,Totale\n';
      state.positions.forEach(pos => {
        csv += `${pos.date},${pos.metal},${pos.quantity},${pos.price},${pos.quantity * pos.price}\n`;
      });
      const link = document.createElement('a');
      link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      link.download = 'portafoglio-oro.csv';
      link.click();
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById(e.target.dataset.tab).classList.add('active');
      });
    });

    // Currency switching
    document.querySelectorAll('.currency-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.currentCurrency = e.target.dataset.currency;
        updateUI();
      });
    });

    // Initialize
    loadData();
    fetchPrices();
    setInterval(fetchPrices, 5 * 60 * 1000); // Aggiorna ogni 5 minuti
    updateUI();
  </script>
</body>
</html>
