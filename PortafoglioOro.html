<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafoglio Oro - Gestione investimenti in tempo reale">
  <meta name="theme-color" content="#d4af37">
  <title>Portafoglio Oro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      padding: 1rem;
      border-bottom: 2px solid #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      color: #d4af37;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .currency-selector {
      display: flex;
      gap: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #d4af37;
    }

    .currency-btn {
      background: transparent;
      border: none;
      color: #e0e0e0;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .currency-btn.active {
      background: #d4af37;
      color: #0a0e27;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .period-selector {
      display: flex;
      gap: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #d4af37;
      flex-wrap: wrap;
    }

    .period-btn {
      background: transparent;
      border: 1px solid #d4af37;
      color: #e0e0e0;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.85rem;
    }

    .period-btn.active {
      background: #d4af37;
      color: #0a0e27;
    }

    .chart-container {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 1.5rem;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f1220 100%);
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .card h3 {
      font-size: 0.9rem;
      color: #c9a961;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .card .value {
      font-size: 1.8rem;
      color: #d4af37;
      font-weight: 700;
    }

    .gain { color: #4ade80; }
    .loss { color: #f87171; }

    .tabs {
      display: flex;
      gap: 1rem;
      border-bottom: 2px solid #1a1f3a;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #888;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      font-weight: 600;
    }

    .tab-btn.active {
      color: #d4af37;
      border-bottom-color: #d4af37;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #c9a961;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      background: #1a1f3a;
      border: 1px solid #d4af37;
      color: #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #c9a961;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    button.btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
      width: 100%;
    }

    button.btn:hover {
      background: #c9a961;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    th {
      background: rgba(212, 175, 55, 0.1);
      color: #d4af37;
      padding: 1rem;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a1f3a;
    }

    .export-btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
    }

    .sync-container {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .sync-btn {
      background: #d4af37;
      color: #0a0e27;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      min-width: 150px;
    }

    .sync-btn:hover {
      background: #c9a961;
    }

    .sync-status {
      color: #4ade80;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .sync-error {
      color: #f87171;
    }

    .google-signin {
      width: 100%;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Portafoglio Oro</h1>
      <div class="header-controls">
        <div class="currency-selector">
          <button class="currency-btn active" data-currency="CHF">CHF</button>
          <button class="currency-btn" data-currency="EUR">EUR</button>
          <button class="currency-btn" data-currency="USD">USD</button>
        </div>
        <div id="googleLoginContainer" style="display: none;">
          <button id="googleSignIn" class="sync-btn" style="min-width: 100px; margin: 0;">Google Drive</button>
        </div>
        <div id="googleLoggedIn" style="display: none; gap: 0.5rem;">
          <span id="userEmail" style="color: #d4af37; font-size: 0.9rem;"></span>
          <button id="googleSignOut" class="sync-btn" style="min-width: 100px; margin: 0; padding: 0.5rem 1rem;">Esci</button>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="summary">
        <div class="card">
          <h3>Valore Totale</h3>
          <div class="value" id="totalValue">0.00</div>
          <div class="currency" id="totalCurrency">CHF</div>
        </div>
        <div class="card">
          <h3>Guadagno / Perdita</h3>
          <div class="value" id="gainLoss" style="color: #d4af37;">0.00</div>
          <div class="currency" id="gainLossPct">0%</div>
        </div>
        <div class="card">
          <h3>Posizioni Attive</h3>
          <div class="value" id="positionCount">0</div>
        </div>
      </div>

      <div>
        <h3 style="color: #d4af37; margin-bottom: 0.75rem;">Periodo Grafico</h3>
        <div class="period-selector" id="periodSelector">
          <button class="period-btn active" data-period="7">7 giorni</button>
          <button class="period-btn" data-period="30">30 giorni</button>
          <button class="period-btn" data-period="90">90 giorni</button>
          <button class="period-btn" data-period="365">1 anno</button>
          <button class="period-btn" data-period="all">Tutto</button>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="goldChart"></canvas>
      </div>

      <div class="chart-container">
        <canvas id="silverChart"></canvas>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="overview">Panoramica</button>
        <button class="tab-btn" data-tab="new">Nuovo Acquisto</button>
        <button class="tab-btn" data-tab="history">Storico</button>
      </div>

      <div class="tab-content active" id="overview">
        <div id="positionsContainer">
          <table id="positionsTable">
            <thead>
              <tr>
                <th>Metallo</th>
                <th>Quantità</th>
                <th>Prezzo Attuale</th>
                <th>Valore Attuale</th>
                <th>Costo Medio</th>
                <th>Gain/Loss</th>
              </tr>
            </thead>
            <tbody id="positionsTableBody"></tbody>
          </table>
        </div>
        <button class="export-btn" onclick="exportCSV()">Esporta CSV</button>
        <div class="sync-container" id="syncControls" style="display: none;">
          <button class="sync-btn" onclick="syncToGoogleDrive()">💾 Sincronizza su Drive</button>
          <button class="sync-btn" onclick="loadFromGoogleDrive()">📥 Carica da Drive</button>
          <span id="syncStatus" class="sync-status"></span>
        </div>
      </div>

      <div class="tab-content" id="new">
        <form onsubmit="addPosition(event)">
          <div class="form-group">
            <label>Metallo</label>
            <select id="metal" required>
              <option value="gold">Oro (g)</option>
              <option value="silver">Argento (g)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantità (grammi)</label>
            <input type="number" id="quantity" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Prezzo Unitario</label>
            <div style="display: flex; gap: 0.5rem;">
              <input type="number" id="price" step="0.01" required style="flex: 1;">
              <input type="text" id="priceCurrency" placeholder="CHF" style="width: 80px;" value="CHF">
            </div>
          </div>
          <div class="form-group">
            <label>Data Acquisto</label>
            <input type="date" id="date" required>
          </div>
          <button class="btn" type="submit">Aggiungi Posizione</button>
        </form>
      </div>

      <div class="tab-content" id="history">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Metallo</th>
              <th>Quantità</th>
              <th>Prezzo</th>
              <th>Valuta</th>
              <th>Totale (CHF)</th>
              <th>Azione</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
